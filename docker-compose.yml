services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sanetes}
      POSTGRES_USER: ${POSTGRES_USER:-sanetes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanetes_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanetes} -d ${POSTGRES_DB:-sanetes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://sanetes:sanetes_local@db:5432/sanetes}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8082,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-sanetes-local-secret-change-in-production}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      FIELD_LOGIN: ${FIELD_LOGIN:-campo}
      FIELD_PASSWORD: ${FIELD_PASSWORD:-campo123}
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  uploads_data:
